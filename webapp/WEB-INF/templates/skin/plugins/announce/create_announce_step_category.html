<div class="row">
	<div class="col-sm-3">
		<#include "navigation_menu.html">
	</div>
	<div class="col-sm-9">

		<div class="card card-body">
			<form class="edit_announce" method="post" action="jsp/site/Portal.jsp?page=announce&action=addnew">
				<label class="form-label">#i18n{announce.create_announce_step_category.labelChooseCategory}</label>

				<select class="form-select mb-3" name="category_id">
					<option value="0">#i18n{announce.search_form.defaultCategoryLabel}</option>
					<#list list_sectors as sector>
					<optgroup label="${sector.label}">
						<#list sector.listCategories as category>
						<option value="${category.id}">${category.label}</option>
						</#list>
					</optgroup>
					</#list>
				</select>
				<button class="btn btn-primary" type="submit">#i18n{announce.create_announce_step_category.buttonSubmit}</button>
			</form>
		</div>
	</div>
</div>
